<!DOCTYPE html>
<html lang="zh-TW" data-cms="admin">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>網站後台｜五股濕地生態園區</title>
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="styles/admin.css" />
</head>
<body>

  <!-- 登入畫面 -->
  <section class="adm-login" id="adm-login">
    <div class="adm-login__card">
      <img src="images/logo-green.webp" alt="五股濕地生態園區" width="200" height="44" />
      <p class="adm-login__subtitle">五股濕地生態園區官方網站</p>
      <h1>後台系統</h1>
      <br />
      <p class="adm-login__hint">請使用具有管理權限的帳號登入</p>
      <div id="adm-google-btn"></div>
      <form id="adm-password-form" hidden>
        <input type="password" id="adm-password" placeholder="管理者密碼" autocomplete="current-password" required />
        <button type="submit" class="adm-btn adm-btn--primary">登入</button>
      </form>
      <p class="adm-login__error" id="adm-login-error" role="alert"></p>
    </div>
  </section>

  <!-- 編輯畫面：只呈現頁面樣貌，網址維持在 /management -->
  <main class="adm-stage" id="adm-stage" hidden>
    <iframe id="adm-frame" name="wugu-cms-admin" title="頁面編輯預覽"
            sandbox="allow-scripts allow-same-origin allow-presentation"></iframe>
    <div class="adm-loading" id="adm-loading"><i class="fa-solid fa-spinner fa-spin" aria-hidden="true"></i>載入中…</div>
  </main>

  <!-- 下方固定工具列 -->
  <nav class="adm-toolbar" id="adm-toolbar" aria-label="後台工具列" hidden>
    <div class="adm-toolbar__group">
      <label class="adm-select" title="切換編輯頁面">
        <i class="fa-solid fa-file-pen" aria-hidden="true"></i>
        <select id="adm-page" aria-label="編輯頁面"></select>
        <i class="fa-solid fa-chevron-down" aria-hidden="true"></i>
      </label>
      <!--<button class="adm-btn adm-btn--ghost" id="adm-outline" aria-pressed="false" title="標示頁面中所有可編輯的範圍"><i class="fa-solid fa-eye-slash" aria-hidden="true"></i><span class="adm-btn__label--sm-hide">顯示編輯範圍</span></button>-->
    </div>
    <div class="adm-toolbar__status">
      <span class="adm-status" id="adm-status" role="status"></span>
    </div>
    <div class="adm-toolbar__group">
      <button class="adm-btn" id="adm-undo" data-shortcut="Z"><i class="fa-solid fa-rotate-left" aria-hidden="true"></i><span>返回</span></button>
      <button class="adm-btn" id="adm-redo" data-shortcut="⇧Z"><i class="fa-solid fa-rotate-right" aria-hidden="true"></i><span>重做</span></button>
      <span class="adm-toolbar__sep" aria-hidden="true"></span>
      <button class="adm-btn adm-btn--danger" id="adm-cancel" title="捨棄此頁所有未儲存的變更"><i class="fa-solid fa-xmark" aria-hidden="true"></i><span class="adm-btn__label--sm-hide">取消變更</span></button>
      <button class="adm-btn adm-btn--primary" id="adm-save" data-shortcut="S"><i class="fa-solid fa-floppy-disk" aria-hidden="true"></i><span>儲存</span></button>
      <button class="adm-btn adm-btn--ghost" id="adm-logout" title="登出"><i class="fa-solid fa-right-from-bracket" aria-hidden="true"></i></button>
    </div>
  </nav>

  <!-- 對話框（novalidate：避免瀏覽器的格式檢查擋住「取消」） -->
  <dialog class="adm-dialog" id="adm-dialog">
    <form method="dialog" novalidate>
      <h2 id="adm-dialog-title"></h2>
      <div id="adm-dialog-body"></div>
      <div class="adm-dialog__actions" id="adm-dialog-actions"></div>
    </form>
  </dialog>

  <div class="adm-toast" id="adm-toast" role="status" aria-live="polite"></div>

  <script src="script/cms.js"></script>
  <script src="script/admin-frame.js"></script>
  <script src="script/admin.js"></script>
</body>
</html>
